<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b1a" />
    <meta
      name="description"
      content="Pixelverse — create, view, and play with pixel art. An all-pixel-art creative playground."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pixelverse" />
    <title>Pixelverse — Pixel Art Playground</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('pixelverse:settings'));
        var t = s && s.state && s.state.theme;
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #0b0b1a;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0b1a;
        color: #19f0d8;
        font-family: ui-monospace, monospace;
        font-size: 13px;
        letter-spacing: 3px;
        z-index: 50;
      }
      #boot .d {
        animation: bootblink 1s steps(2, end) infinite;
      }
      @keyframes bootblink {
        50% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">LOADING PIXELVERSE<span class="d">_</span></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
